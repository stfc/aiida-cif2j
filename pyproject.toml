[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-cif2j"
version = "0.0.1"
description = "AiiDA workflow plugin for calculating magnetic exchange interactions."
authors = [
    { name = "Dr. Benjamin T. Speake", email = "benjamin.speake@stfc.ac.uk" },
]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["aiida", "magnetic exchange"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python 3",
    "Topic :: Scientific/Engineering",
    "Framework :: AiiDA",
    "Development Status :: 3 - Alpha",
]
requires-python = ">=3.10"
dependencies = ["aiida-core>=2.7,<3"]

[project.urls]
Source = "https://github.com/stfc/aiida-cif2j"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."aiida.calculations"]
"cif2j.wannier_tb2j" = "aiida_cif2j.calculations.wannier_tb2j:WannierTB2JCalculation"

[project.entry-points."aiida.parsers"]
"tb2j" = "aiida_cif2j.parsers.tb2j:TB2JParser"


[project.entry-points."aiida.workflows"]


[project.entry-points."aiida.data"]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.0",
    "ruff>=0.11.0",
    "pre-commit",
]
docs = ["sphinx>=8.0.2", "piccolo-theme>=0.14.0", "sphinx-toolbox", "numpydoc"]

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
exclude = ["conf.py"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["B008"]

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # pylint
    "C",
    "R",
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    "FA",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
]
ignore = ["C901"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 10
