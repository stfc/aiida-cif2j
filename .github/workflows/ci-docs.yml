name: ci-documentation

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

jobs:

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Install requirements
              run: |
                python -m pip install --upgrade pip
                pip install .[docs]
                pip install "aiida-wannier90-workflows @ git+https://github.com/aiidateam/aiida-wannier90-workflows.git@v3.1.0"

            - name: Build the docs
              run: sphinx-build -b html docs/source docs/build/html

            - name: Upload Docs
              if: ${{ github.event_name == 'push' }}
              uses: actions/upload-pages-artifact@v3
              with:
                path: ./docs/build/html

    deploy:
        needs: build
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: "pages"
            cancel-in-progress: false
        steps:
            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
