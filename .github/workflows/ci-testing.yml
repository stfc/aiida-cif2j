name: ci-testing
on: 
    push:
        branches: 
            - main
    pull_request:
        branches:
            - main

jobs:
    style-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup Python 
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"

            - name: Install Ruff
              run: |
                python -m pip install --upgrade pip
                pip install ruff

            - name: Run the linter
              run: ruff check

            - name: Run the formatter
              run: ruff format --check

    pytest:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13"]
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup Python 3.12
              uses: actions/setup-python@v5 
              with:
                python-version: ${{ matrix.python-version }}

            - name: Run test suite with coverage
              if: contains(matrix.python-version, '3.12')
              run: |
                pip install .[dev]
                pip install "aiida-wannier90 @ git+https://github.com/aiidateam/aiida-wannier90.git@v2.2.0" "aiida-wannier90-workflows @ git+https://github.com/aiidateam/aiida-wannier90-workflows.git@v3.1.0"
                pytest -n auto --cov=aiida-cif2j --cov-report=xml:coverage.xml

            - name: Run test suite without coverage
              if: ${{ !contains(matrix.python-version, '3.12') }}
              run: |
                pip install .[dev]
                pytest -n auto

            - name: Report coverage to Coveralls
              if: contains(matrix.python-version, '3.12')
              uses: coverallsapp/github-action@v2
              with:
                file: coverage.xml
                base-path: src/aiida_cif2j
                fail-on-error: false